<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame Generator - A Day In My Life</title>
  <!-- Google Fonts: Poppins untuk tampilan modern dan bersih -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">
  <!-- html2canvas untuk fitur unduh gambar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: #ffb74d;
    }

    /* Container Utama Frame */
    .frame-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 400px;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      background-color: #333;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Gambar Latar Belakang */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Gradient/Alas Cokelat Semi Transparan */
    .overlay-brown {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%; /* Mengisi area bawah hingga pertengahan */
      background: linear-gradient(to top, rgba(100, 35, 10, 0.85) 0%, rgba(130, 50, 15, 0.65) 60%, rgba(0, 0, 0, 0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Konten Teks di Atas Frame */
    .content-box {
      position: relative;
      z-index: 3;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    /* Header / Alas Kuning */
    .title-badge {
      background-color: #ffb74d;
      color: #000000;
      padding: 8px 18px;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: -0.3px;
      display: inline-block;
      line-height: 1;
    }

    /* Deskripsi Teks */
    .description-text {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 200;
      line-height: 1.5;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      max-width: 95%;
    }

    /* Panel Kontrol Pengguna */
    .controls {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.85rem;
      color: #ccc;
    }

    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 0.9rem;
    }

    textarea {
      resize: vertical;
      height: 70px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-download {
      background-color: #ffb74d;
      color: #000;
    }

    .btn-download:hover {
      background-color: #ffa726;
    }

    .btn-share {
      background-color: #29b6f6;
      color: #fff;
    }

    .btn-share:hover {
      background-color: #0288d1;
    }
  </style>
</head>
<body>

  <h1>Frame Design Editor</h1>

  <!-- Area Frame Hasil -->
  <div class="frame-container" id="frameCanvas">
    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1000&auto=format&fit=crop" id="bgPreview" class="bg-image" alt="Background">
    <div class="overlay-brown"></div>
    <div class="content-box">
      <div class="title-badge" id="titleDisplay">A Day In My Life</div>
      <p class="description-text" id="descDisplay">
        Kamu bisa share rutinitas keseharian kamu. Misal saat bersih-bersih rumah, kegiatan di akhir pekan, ataupun berbagi tips membagi waktu ala ibu rumah tangga.
      </p>
    </div>
  </div>

  <!-- Panel Edit & Kontrol -->
  <div class="controls">
    <div class="form-group">
      <label for="imageInput">Upload Gambar Background:</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="form-group">
      <label for="titleInput">Judul (Alas Kuning):</label>
      <input type="text" id="titleInput" value="A Day In My Life">
    </div>

    <div class="form-group">
      <label for="descInput">Deskripsi Teks:</label>
      <textarea id="descInput">Kamu bisa share rutinitas keseharian kamu. Misal saat bersih-bersih rumah, kegiatan di akhir pekan, ataupun berbagi tips membagi waktu ala ibu rumah tangga.</textarea>
    </div>

    <div class="btn-group">
      <button class="btn-download" onclick="downloadImage()">Download Gambar</button>
      <button class="btn-share" onclick="shareImage()">Share ke Medsos</button>
    </div>
  </div>

  <script>
    // Live update teks Judul
    document.getElementById('titleInput').addEventListener('input', function(e) {
      document.getElementById('titleDisplay').innerText = e.target.value || 'Judul Utama';
    });

    // Live update teks Deskripsi
    document.getElementById('descInput').addEventListener('input', function(e) {
      document.getElementById('descDisplay').innerText = e.target.value || 'Tuliskan deskripsi di sini...';
    });

    // Fitur Upload dan Ganti Gambar Background
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById('bgPreview').src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Fitur Download Frame sebagai Gambar
    function downloadImage() {
      const frame = document.getElementById('frameCanvas');
      html2canvas(frame, { useCORS: true, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'a-day-in-my-life.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Fitur Share ke Media Sosial
    async function shareImage() {
      const frame = document.getElementById('frameCanvas');
      try {
        const canvas = await html2canvas(frame, { useCORS: true, scale: 2 });
        canvas.toBlob(async (blob) => {
          const file = new File([blob], 'my-day.png', { type: 'image/png' });
          
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: 'A Day In My Life',
              text: document.getElementById('descDisplay').innerText,
              files: [file]
            });
          } else {
            alert('Fitur share langsung tidak didukung di browser ini. Hasil gambar akan diunduh terlebih dahulu.');
            downloadImage();
          }
        }, 'image/png');
      } catch (err) {
        console.error('Error sharing:', err);
      }
    }
  </script>
</body>
</html>
