<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuat Gambar Berita Pro</title>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DV25BYV3TL');
    </script>
    <!-- Tambahkan tombol kembali -->
    <script src="../tombol-kembali.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .form-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 400px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .form-group textarea,
        .form-group input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
        }

        /* Styling untuk Tombol Upload Gambar & Kamera */
        .upload-options {
            display: flex;
            gap: 10px;
        }

        .btn-upload {
            flex: 1;
            padding: 8px 12px;
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .btn-upload:hover {
            background-color: #2d3748;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .btn-simpan { background-color: #2e7d32; }
        .btn-share { background-color: #1565c0; }
        .btn:hover { opacity: 0.9; }

        /* Container gambar akan secara dinamis menyesuaikan tinggi berdasarkan rasio */
        .container-berita {
            position: relative;
            width: 400px;
            height: auto;
            background-color: #ddd;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .container-berita img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65%;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            pointer-events: none;
        }

        .konten-teks {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            color: white;
        }

        .judul-berita {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 5px;
        }

        /* Alas Teks Semi-Transparan */
        .bg-oranye { 
            background-color: rgba(255, 152, 0, 0.7);
            color: white; 
            padding: 2px 8px; 
            border-radius: 3px; 
            display: inline-block; 
            margin-bottom: 4px; 
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        
        .putih { 
            background-color: rgba(255, 255, 255, 0.75); 
            color: #111;
            padding: 2px 8px; 
            border-radius: 3px; 
            display: inline-block; 
            margin-bottom: 4px;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        
        .bg-biru { 
            background-color: rgba(30, 58, 138, 0.7);
            color: white; 
            padding: 2px 8px; 
            border-radius: 3px; 
            display: inline-block; 
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .sumber-foto {
            font-size: 11px;
            color: #ddd;
            margin-bottom: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h2>Konten Berita Generator Pro</h2>
    
    <div class="form-panel">
        <div class="form-group">
            <label>1. Pilih Gambar</label>
            <div class="upload-options">
                <button class="btn-upload" onclick="document.getElementById('upload-galeri').click()">🖼️ Galeri</button>
                <button class="btn-upload" onclick="document.getElementById('upload-kamera').click()">📷 Kamera</button>
            </div>
            <!-- Input tersembunyi untuk galeri dan kamera -->
            <input type="file" id="upload-galeri" accept="image/*" style="display: none;">
            <input type="file" id="upload-kamera" accept="image/*" capture="environment" style="display: none;">
        </div>
        
        <div class="form-group">
            <label>2. Teks Berita (Gunakan Enter untuk Baris Baru)</label>
            <textarea id="input-berita" rows="3">Pendamping Pkh
Melakukan kegiatan P2K2 
Guna Merubah mindset</textarea>
        </div>
        
        <div class="form-group">
            <label>3. Sumber Foto</label>
            <input type="text" id="input-foto" value="Foto: Istimewa">
        </div>

        <div class="btn-group">
            <button class="btn btn-simpan" id="btn-simpan">💾 Simpan Gambar</button>
            <button class="btn btn-share" id="btn-share">📢 Bagikan</button>
        </div>
    </div>

    <div class="container-berita" id="area-berita">
        <img id="preview-img" src="https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=400&q=80" alt="Berita" crossorigin="anonymous">
        <div class="overlay"></div>
        <div class="konten-teks">
            <div class="sumber-foto" id="text-foto">Foto: Istimewa</div>
            <div class="judul-berita">
                <span class="bg-oranye" id="text-baris1">Pendamping PKH</span><br>
                <span class="putih" id="text-baris2">Melakukan kegiatan P2K2</span><br>
                <span class="bg-biru" id="text-baris3">Guna Merubah mindset</span>
            </div>
        </div>
    </div>

    <script>
        const uploadGaleri = document.getElementById('upload-galeri');
        const uploadKamera = document.getElementById('upload-kamera');
        const inputBerita = document.getElementById('input-berita');
        const inputFoto = document.getElementById('input-foto');

        const previewImg = document.getElementById('preview-img');
        const textBaris1 = document.getElementById('text-baris1');
        const textBaris2 = document.getElementById('text-baris2');
        const textBaris3 = document.getElementById('text-baris3');
        const textFoto = document.getElementById('text-foto');

        const btnSimpan = document.getElementById('btn-simpan');
        const btnShare = document.getElementById('btn-share');
        const areaBerita = document.getElementById('area-berita');

        // --- Penyesuaian Rasio Otomatis ---
        function sesuaikanRasioGambar() {
            const lebarAsli = previewImg.naturalWidth;
            const tinggiAsli = previewImg.naturalHeight;
            
            if (lebarAsli && tinggiAsli) {
                const lebarContainer = 400; 
                const tinggiProporsional = (tinggiAsli / lebarAsli) * lebarContainer;
                areaBerita.style.height = tinggiProporsional + 'px';
            }
        }

        previewImg.addEventListener('load', sesuaikanRasioGambar);

        // --- Fungsi Penanganan File Gambar ---
        function tanganiUnggahGambar(file) {
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.setAttribute('src', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }

        uploadGaleri.addEventListener('change', function() {
            tanganiUnggahGambar(this.files[0]);
        });

        uploadKamera.addEventListener('change', function() {
            tanganiUnggahGambar(this.files[0]);
        });

        // --- Update Teks Berita ---
        inputBerita.addEventListener('input', function() {
            const baris = this.value.split('\n');

            if (baris[0] && baris[0].trim() !== "") {
                textBaris1.textContent = baris[0];
                textBaris1.style.display = "inline-block";
            } else {
                textBaris1.style.display = "none";
            }

            if (baris[1] && baris[1].trim() !== "") {
                textBaris2.textContent = baris[1];
                textBaris2.style.display = "inline-block";
            } else {
                textBaris2.style.display = "none";
            }

            if (baris[2] && baris[2].trim() !== "") {
                textBaris3.textContent = baris[2];
                textBaris3.style.display = "inline-block";
            } else {
                textBaris3.style.display = "none";
            }
        });

        // --- Update Sumber Foto ---
        inputFoto.addEventListener('input', function() {
            textFoto.textContent = this.value;
        });

        // --- Inisialisasi awal ---
        inputBerita.dispatchEvent(new Event('input'));
        inputFoto.dispatchEvent(new Event('input'));
        if (previewImg.complete) {
            sesuaikanRasioGambar();
        }

        // --- Fitur Simpan Gambar ---
        btnSimpan.addEventListener('click', async function() {
            try {
                if (!previewImg.complete) {
                    await new Promise((resolve) => previewImg.onload = resolve);
                }

                const canvas = await html2canvas(areaBerita, {
                    useCORS: true,
                    scale: 2,
                    allowTaint: false,
                    backgroundColor: null,
                    logging: false,
                });

                const link = document.createElement('a');
                link.download = 'berita-media-sosial.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error('Gagal menyimpan gambar:', err);
                alert('Terjadi kesalahan saat menyimpan gambar: ' + err.message);
            }
        });

        // --- Fitur Share / Bagikan ---
        btnShare.addEventListener('click', async function() {
            try {
                if (!previewImg.complete) {
                    await new Promise((resolve) => previewImg.onload = resolve);
                }

                const canvas = await html2canvas(areaBerita, {
                    useCORS: true,
                    scale: 2,
                    allowTaint: false,
                    logging: false
                });

                canvas.toBlob(blob => {
                    if (!blob) {
                        alert("Gagal membuat gambar untuk dibagikan.");
                        return;
                    }
                    
                    const file = new File([blob], "berita.png", { type: "image/png" });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({
                            files: [file],
                            title: 'Berita Hari Ini',
                            text: textBaris1.textContent + " " + textBaris2.textContent
                        })
                        .then(() => console.log('Berhasil membagikan!'))
                        .catch((error) => console.log('Batal/Gagal membagikan:', error));
                    } else {
                        alert("Browser Anda tidak mendukung fitur berbagi file secara langsung. Silakan simpan gambar terlebih dahulu.");
                    }
                }, 'image/png');
            } catch (err) {
                console.error('Gagal membagikan:', err);
                alert('Gagal membagikan: ' + err.message);
            }
        });
    </script>

</body>
</html>
